# DOKTA OS — single web app, four role areas behind one domain.

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9.12.0"
  NEXT_PUBLIC_SUPABASE_URL = "https://gojugsbxonazeuzjnego.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_W2LAuGwONU7WY_IR5l0Iww_-BQGUTaL"
  APP_URL = "https://dokta-app.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"

# Health information must never sit in a shared cache.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, private"

[[headers]]
  for = "/patient/*"
  [headers.values]
    Cache-Control = "no-store, private"
