<body class="bg-[#f8fafc]">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const load=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

const initPatients=[
 {id:'1', name:'Sarah Johnson', age:62, gender:'F', phone:'+1 555 0101', idNumber:'P-1001', conditions:['Hypertension'], risk:'high', hasWearable:true, notes:'Allergic to Penicillin', adherence:68},
 {id:'2', name:'James Carter', age:54, gender:'M', phone:'+1 555 0102', idNumber:'P-1002', conditions:['Hypertension','Diabetes'], risk:'critical', hasWearable:true, notes:'Transport cost issue', adherence:45},
 {id:'3', name:'Emily Chen', age:38, gender:'F', phone:'+1 555 0103', idNumber:'P-1003', conditions:['Diabetes'], risk:'moderate', hasWearable:true, notes:'', adherence:82},
 {id:'4', name:'Michael Smith', age:45, gender:'M', phone:'+1 555 0104', idNumber:'P-1004', conditions:['Asthma'], risk:'low', hasWearable:false, notes:'', adherence:91},
];
const initAppts=[
 {id:'a1', patientName:'Sarah Johnson', phone:'+1 555 0101', doctor:'Dr. Adams', datetime:new Date(Date.now()+3600000).toISOString().slice(0,16), reason:'Hypertension', status:'checked-in', type:'in-person'},
 {id:'a2', patientName:'James Carter', phone:'+1 555 0102', doctor:'Dr. Lee', datetime:new Date().toISOString().slice(0,16), reason:'Diabetes', status:'with-doctor', type:'in-person'},
 {id:'a3', patientName:'Emily Chen', phone:'+1 555 0103', doctor:'Dr. Adams', datetime:new Date(Date.now()+7200000).toISOString().slice(0,16), reason:'Diabetes', status:'scheduled', type:'telehealth'},
];
const initWearables=[
 {id:'w1', patientId:'1', patientName:'Sarah Johnson', device:'Apple Watch SE', battery:78, hr:84, sys:138, dia:88, spo2:96, temp:36.7, lastSync:new Date().toISOString(), alert:'warning', history:[]},
 {id:'w2', patientId:'2', patientName:'James Carter', device:'Galaxy Watch 6', battery:62, hr:128, sys:182, dia:108, spo2:92, temp:37.8, lastSync:new Date().toISOString(), alert:'critical', history:[]},

];
const initConsults=[

];
const initScripts=[

];
const initInv=[
 {id:'i1', med:'Amlodipine 5mg', stock:24, min:20},
 {id:'i2', med:'Metformin 500mg', stock:8, min:30},
 {id:'i3', med:'Lisinopril 10mg', stock:55, min:20},
 {id:'i4', med:'Atorvastatin 20mg', stock:12, min:25},
];

function App(){
 const [active,setActive]=useState('consultations');
 const [patients,setPatients]=useState(()=>load('dokta_patients',initPatients));
 const [appts,setAppts]=useState(()=>load('dokta_appts',initAppts));
 const [wearables,setWearables]=useState(()=>load('dokta_wearables',initWearables));
 const [consults,setConsults]=useState(()=>load('dokta_consults',initConsults));
 const [scripts,setScripts]=useState(()=>load('dokta_scripts',initScripts));
 const [inventory,setInventory]=useState(()=>load('dokta_inventory',initInv));
 const [billing,setBilling]=useState(()=>load('dokta_billing',[]));
 const [messages,setMessages]=useState(()=>load('dokta_msgs',[]));
 const [search,setSearch]=useState('');
 const [statusFilter,setStatusFilter]=useState('All');
 const [showModal,setShowModal]=useState(null);
 const [modalData,setModalData]=useState({});
 const [selectedPatient,setSelectedPatient]=useState(null);
 const [consultForm,setConsultForm]=useState(null);
 const [chat,setChat]=useState(()=>load('dokta_chat',[{role:'bot',text:'Welcome to Dokta. All modules fully operational. Consultations: SOAP with auto-fill vitals from live watches. Ask me live data.'}]));
 const [chatInput,setChatInput]=useState('');

 useEffect(()=>save('dokta_patients',patients),[patients]);
 useEffect(()=>save('dokta_appts',appts),[appts]);
 useEffect(()=>save('dokta_wearables',wearables),[wearables]);
 useEffect(()=>save('dokta_consults',consults),[consults]);
 useEffect(()=>save('dokta_scripts',scripts),[scripts]);
 useEffect(()=>save('dokta_inventory',inventory),[inventory]);
 useEffect(()=>save('dokta_billing',billing),[billing]);
 useEffect(()=>save('dokta_msgs',messages),[messages]);
 useEffect(()=>save('dokta_chat',chat),[chat]);

 useEffect(()=>{
  const id=setInterval(()=>{
   setWearables(prev=>prev.map(w=>{
    const hr=Math.max(40,Math.min(160,w.hr+(Math.random()*6-3)));
    const sys=Math.max(90,Math.min(200,w.sys+(Math.random()*4-2)));
    const dia=Math.max(60,Math.min(120,w.dia+(Math.random()*3-1.5)));
    const spo2=Math.max(85,Math.min(100,w.spo2+(Math.random()*1-0.5)));
    const temp=Math.max(35.5,Math.min(40,w.temp+(Math.random()*0.2-0.1)));
    let alert='normal';
    if(hr>100||hr<50||sys>=140||dia>=90||spo2<94||temp>=37.5) alert='warning';
    if(hr>120||hr<40||sys>180||dia>110||spo2<90||temp>39.5) alert='critical';
    const history=[...(w.history||[]),{t:Date.now(),hr}].slice(-20);
    return {...w, hr:Math.round(hr), sys:Math.round(sys), dia:Math.round(dia), spo2:Math.round(spo2), temp:Math.round(temp*10)/10, alert, lastSync:new Date().toISOString(), history};
   }));
  },3000);
  return ()=>clearInterval(id);
 },[]);

 const critical=wearables.filter(w=>w.alert==='critical').length;
 const warning=wearables.filter(w=>w.alert==='warning').length;

 const filteredAppts=appts.filter(a=>{
  const s=!search||a.patientName.toLowerCase().includes(search.toLowerCase());
  const st=statusFilter==='All'||a.status===statusFilter;
  return s&&st;
 });
 const filteredPatients=patients.filter(p=>!search||p.name.toLowerCase().includes(search.toLowerCase())||p.phone.includes(search));

 const menu=[
  {k:'dashboard',label:'Dashboard',icon:'📊'},
  {k:'appointments',label:'Appointments',icon:'📅'},
  {k:'patients',label:'Patients',icon:'👥'},
  {k:'wearables',label:'Monitoring',icon:'⌚',badge:critical>0?critical:null,live:true},
  {k:'consultations',label:'Consultations',icon:'🩺',badge:appts.filter(a=>a.status==='checked-in'||a.status==='with-doctor').length},
  {k:'prescriptions',label:'Prescriptions',icon:'💊'},
  {k:'pharmacy_board',label:'Pharmacy Board',icon:'📦'},
  {k:'inventory',label:'Inventory Alerts',icon:'⚠️',badge:inventory.filter(i=>i.stock<i.min).length},
  {k:'billing',label:'Billing',icon:'💳'},
  {k:'messaging',label:'Messaging',icon:'💬'},
  {k:'visit_analytics',label:'Visit Analytics',icon:'📈'},
  {k:'ai_assistants',label:'AI Assistants',icon:'🤖'},
  {k:'settings',label:'Settings',icon:'⚙️'},
 ];

 return (

   <nav className="flex-1 p-3 space-y-1">{menu.map(m=><button key={m.k} onClick={()=>setActive(m.k)} className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm transition ${active===m.k?'bg-teal-600 text-white':'text-white/70 hover:bg-white/10 hover:text-white'}`}><span className="flex items-center gap-3"><span>{m.icon}</span>{m.label}{m.live&&<span className="w-2 h-2 bg-green-400 pulse-dot"></span>}</span>{m.badge>0&&<span className={`text-xs px-2 py-0.5 rounded-full ${m.k==='wearables'?'bg-red-500':'bg-teal-500'} text-white`}>{m.badge}</span>}</button>)}</nav>
   <div className="p-3 border-t border-white/10 text-xs text-white/40">Patient Mgmt + Dispensary + Monitoring</div>
  </div>

  <div className="ml-64 flex-1 min-h-screen">
   <div className="h-14 bg-white border-b flex items-center justify-between px-6 sticky top-0 z-10">
    <div className="flex items-center gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search patients, appointments..." className="w-72 px-3 py-1.5 rounded-lg border text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"/><select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} className="px-2 py-1.5 border rounded-lg text-sm"><option value="All">All Status</option><option>scheduled</option><option>checked-in</option><option>with-doctor</option><option>ready_for_collection</option><option>dispensed</option></select></div>
    <div className="flex items-center gap-3"><span className="text-sm">🔔 {critical+warning}</span><div className="w-8 h-8 bg-teal-600 rounded-full flex items-center justify-center text-white text-sm">DR</div></div>
   </div>

   <div className="p-6">
    {active==='dashboard'&&(
      <div>
        <h1 className="text-2xl font-bold">Dashboard</h1><p className="text-sm text-gray-500 mb-4">Patient Management + Dispensary + Remote Monitoring</p>
        <div className="grid grid-cols-3 md:grid-cols-6 gap-3 mb-6">
          <div className="bg-white p-4 rounded-xl shadow-sm border"><div className="text-xs text-gray-500">Patients</div><div className="text-2xl font-bold">{patients.length}</div></div>
          <div className="bg-white p-4 rounded-xl shadow-sm border"><div className="text-xs text-gray-500">Appointments Today</div><div className="text-2xl font-bold">{appts.length}</div></div>
          <div className="bg-white p-4 rounded-xl shadow-sm border"><div className="text-xs text-gray-500">Queue Waiting</div><div className="text-2xl font-bold">{appts.filter(a=>a.status==='checked-in').length}</div></div>
          <div className="bg-white p-4 rounded-xl shadow-sm border"><div className="text-xs text-gray-500">Watches Active</div><div className="text-2xl font-bold text-teal-600">{wearables.length}</div></div>
          <div className="bg-white p-4 rounded-xl shadow-sm border"><div className="text-xs text-gray-500">Critical</div><div className="text-2xl font-bold text-red-600">{critical}</div><div className="text-[11px] text-amber-600">{warning} warnings</div></div>
          <div className="bg-white p-4 rounded-xl shadow-sm border"><div className="text-xs text-gray-500">Pharmacy Ready</div><div className="text-2xl font-bold">{scripts.filter(s=>s.status==='ready_for_collection').length}</div></div>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div className="bg-white p-4 rounded-xl border shadow-sm"><div className="font-semibold mb-2">Hourly Patient Flow (Live from Appointments)</div><div className="flex items-end gap-1 h-24">{Array.from({length:12},(_,i)=>{const c=appts.filter(a=> new Date(a.datetime).getHours()===8+i).length||Math.floor(Math.random()*2); return <div key={i} className="flex-1 bg-teal-500 rounded-t" style={{height:`${20+c*25}%`}}></div>})}</div><div className="flex justify-between text-[10px] text-gray-400 mt-1"><span>8am</span><span>8pm</span></div></div>
          <div className="bg-white p-4 rounded-xl border shadow-sm"><div className="font-semibold mb-2">Critical Alerts Live - {critical+warning}</div>{wearables.filter(w=>w.alert!=='normal').length===0?<div className="text-sm text-gray-400">No alerts - all vitals normal ✅</div>:wearables.filter(w=>w.alert!=='normal').map(w=><div key={w.id} className={`p-2 rounded-lg mb-2 text-sm ${w.alert==='critical'?'bg-red-50 border border-red-200':'bg-amber-50 border border-amber-200'}`}><b>{w.patientName}</b> - HR {w.hr} BP {w.sys}/{w.dia} SpO2 {w.spo2}% - {w.alert.toUpperCase()}</div>)}</div>
        </div>
        <div className="mt-4 bg-teal-600 text-white p-4 rounded-xl text-sm">Process: Scheduled → Checked-in → With Doctor → Consultation SOAP → Pharmacy Board (To Fill → Filling → Ready) → Dispensed → Billing → Continuous Monitoring</div>
      </div>
    )}

    {active==='consultations'&&(
      <div>
        <div className="flex justify-between items-center mb-4"><h1 className="text-2xl font-bold">Consultations</h1><div className="text-xs text-gray-500">{consults.length} completed • {appts.filter(a=>a.status==='checked-in'||a.status==='with-doctor').length} in queue • Auto-fill vitals from live watches</div></div>
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div className="lg:col-span-1 bg-white rounded-xl border shadow-sm p-4">
            <div className="font-semibold mb-3 flex justify-between items-center"><span>Queue (Check-in + With Doctor)</span><span className="text-xs bg-teal-100 text-teal-700 px-2 py-1 rounded-full">{appts.filter(a=>a.status==='checked-in'||a.status==='with-doctor').length}</span></div>
            <div className="space-y-2 max-h-[650px] overflow-y-auto">
              {appts.filter(a=>a.status==='checked-in'||a.status==='with-doctor').map(a=>{
                const w=wearables.find(x=>x.patientName===a.patientName);
                return <div key={a.id} className="p-3 border rounded-lg hover:bg-gray-50">
                  <div className="font-medium text-sm">{a.patientName}</div>
                  <div className="text-xs text-gray-500">{a.reason} • {a.doctor} • {new Date(a.datetime).toLocaleTimeString()}</div>
                  {w&&<div className="text-[11px] mt-1 p-1.5 bg-gray-50 rounded border">⌚ LIVE: HR {w.hr} BP {w.sys}/{w.dia} SpO2 {w.spo2}% Temp {w.temp}°C {w.alert==='critical'&&<span className="text-red-600 font-bold">• CRITICAL</span>}</div>}
                  <button onClick={()=>{setConsultForm({patientName:a.patientName, doctor:a.doctor, apptId:a.id, subjective:'', objective:w?`HR ${w.hr} bpm, BP ${w.sys}/${w.dia} mmHg, SpO2 ${w.spo2}%, Temp ${w.temp}°C, Battery ${w.battery}% - from ${w.device}`:'', assessment:'', plan:'', date:new Date().toISOString()});}} className="mt-2 w-full bg-teal-600 text-white py-1.5 rounded-lg text-xs font-semibold hover:bg-teal-700">Start Consultation</button>
                </div>
              })}
              {appts.filter(a=>a.status==='checked-in'||a.status==='with-doctor').length===0&&<div className="text-center py-10 text-gray-400 text-sm"><div className="text-3xl mb-2">📋</div>No patients in queue.<br/>Add appointment and Check-in first.<br/><button onClick={()=>setActive('appointments')} className="mt-3 px-4 py-1.5 bg-blue-500 text-white rounded-lg text-xs">Go to Appointments</button></div>}
            </div>
          </div>
          <div className="lg:col-span-2">
            {consultForm?(
              <div className="bg-white rounded-xl border shadow-sm p-5">
                <div className="flex justify-between items-center mb-4"><h2 className="font-bold text-lg">SOAP Consultation - {consultForm.patientName}</h2><button onClick={()=>setConsultForm(null)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">×</button></div>
                <div className="grid gap-4 text-sm">
                  <div><label className="font-semibold text-xs uppercase tracking-wide">Subjective (Patient complaint)</label><textarea value={consultForm.subjective} onChange={e=>setConsultForm({...consultForm, subjective:e.target.value})} placeholder="e.g. Headache 2 days, dizziness, chest pain..." className="w-full border rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-teal-500 focus:outline-none" rows="2"></textarea></div>
                  <div><div className="flex justify-between items-center"><label className="font-semibold text-xs uppercase tracking-wide">Objective (Vitals, exam)</label><button onClick={()=>{const w=wearables.find(x=>x.patientName===consultForm.patientName); if(w) setConsultForm({...consultForm, objective:`HR ${w.hr} bpm, BP ${w.sys}/${w.dia} mmHg, SpO2 ${w.spo2}%, Temp ${w.temp}°C, Battery ${w.battery}% - Auto-filled LIVE from ${w.device} at ${new Date(w.lastSync).toLocaleTimeString()}`}); else alert('No wearable connected for this patient - connect device first');}} className="text-[11px] bg-teal-600 text-white px-3 py-1 rounded-full hover:bg-teal-700">⌚ Auto-fill from Live Watch</button></div><textarea value={consultForm.objective} onChange={e=>setConsultForm({...consultForm, objective:e.target.value})} placeholder="Vitals, physical exam findings..." className="w-full border rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-teal-500 focus:outline-none" rows="3"></textarea></div>
                  <div><label className="font-semibold text-xs uppercase tracking-wide">Assessment (Diagnosis)</label><textarea value={consultForm.assessment} onChange={e=>setConsultForm({...consultForm, assessment:e.target.value})} placeholder="e.g. Hypertension Stage 2, uncontrolled, Diabetes Type 2" className="w-full border rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-teal-500 focus:outline-none" rows="2"></textarea></div>
                  <div><label className="font-semibold text-xs uppercase tracking-wide">Plan (Treatment)</label><textarea value={consultForm.plan} onChange={e=>setConsultForm({...consultForm, plan:e.target.value})} placeholder="e.g. Increase Amlodipine to 10mg daily, lifestyle counseling, BMP, review in 1 week" className="w-full border rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-teal-500 focus:outline-none" rows="2"></textarea></div>
                </div>
                <div className="flex gap-2 mt-5">

  {showModal==='message'&&(<div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"><div className="bg-white rounded-xl w-full max-w-lg p-6 shadow-xl"><div className="flex justify-between items-center mb-4"><h2 className="font-bold text-lg">New Message</h2><button onClick={()=>setShowModal(null)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">×</button></div><div className="grid gap-3 text-sm"><select value={modalData.to||''} onChange={e=>setModalData({...modalData,to:e.target.value})} className="border rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-teal-500"><option value="">Select Patient</option>{patients.map(p=><option key={p.id} value={p.name}>{p.name} {p.phone}</option>)}</select><select value={modalData.template||'Appointment Reminder'} onChange={e=>{const t=e.target.value; let txt=''; if(t==='Appointment Reminder') txt=`Hello ${modalData.to||''}, your appointment is tomorrow at 9am. Please bring ID.`; if(t==='Collection Ready') txt=`Hello ${modalData.to||''}, your medication is ready for collection.`; if(t==='Vitals Alert') txt=`Hello ${modalData.to||''}, your vitals are high. Please rest and clinic will call.`; setModalData({...modalData,template:t,text:txt});}} className="border rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-teal-500"><option>Appointment Reminder</option><option>Collection Ready</option><option>Adherence Nudge</option><option>Vitals Alert</option></select><textarea value={modalData.text||''} onChange={e=>setModalData({...modalData,text:e.target.value})} placeholder="Message" className="border rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-teal-500" rows="3"></textarea></div><button onClick={()=>{setMessages(prev=>[...prev,{id:'m'+Date.now(),to:modalData.to||'Patient',text:modalData.text||'',time:new Date().toISOString(),status:'sent'}]); setShowModal(null); setModalData({});}} className="mt-5 w-full bg-green-600 text-white py-2.5 rounded-lg font-medium hover:bg-green-700">✓ Send - Logs it!</button></div></div>)}
  {showModal==='inventory'&&(<div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4"><div className="bg-white rounded-xl w-full max-w-lg p-6 shadow-xl"><div className="flex justify-between items-center mb-4"><h2 className="font-bold text-lg">Add Medication</h2><button onClick={()=>setShowModal(null)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">×</button></div><div className="grid gap-3 text-sm"><input value={modalData.med||''} onChange={e=>setModalData({...modalData,med:e.target.value})} placeholder="Medication name *" className="border rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-teal-500"/><input type="number" value={modalData.stock||''} onChange={e=>setModalData({...modalData,stock:e.target.value})} placeholder="Stock qty" className="border rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-teal-500"/><input type="number" value={modalData.min||''} onChange={e=>setModalData({...modalData,min:e.target.value})} placeholder="Min level" className="border rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-teal-500"/></div><button onClick={()=>{const id='i'+Date.now(); setInventory(prev=>[...prev,{id,med:modalData.med||'New Med',stock:parseInt(modalData.stock)||10,min:parseInt(modalData.min)||20}]); setShowModal(null); setModalData({});}} className="mt-5 w-full bg-teal-600 text-white py-2.5 rounded-lg font-medium hover:bg-teal-700">✓ Add to Inventory</button></div></div>)}
